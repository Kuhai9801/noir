name: Noir principal repros

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run Noir principal repro script
        shell: bash
        run: bash repros/noir-principal-repros.sh

      - name: Upload repro logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: noir-principal-repro-logs
          path: repro-logs
          if-no-files-found: error
